<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Haskell WASM Hello</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        input, button {
            font-size: 1rem;
            padding: 0.5rem;
        }

        #output {
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Haskell WebAssembly demo</h1>

    <label for="name">Name:</label>
    <input id="name" type="text" value="John" placeholder="Enter your name" />
    <button id="helloButton" type="button">Say hello</button>

    <p id="output"></p>

    <!-- type="module" permits imports in app.js -->
    <script type="module" src="./app.js"></script>
</body>
</html>
